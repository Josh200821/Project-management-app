[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saas-platform-api"
version = "1.0.0"
description = "SaaS Project Management Platform API"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "python-multipart==0.0.32",
    "httpx==0.28.1",

    # Database
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "psycopg2-binary==2.9.12",
    "alembic==1.19.1",

    # Validation
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",

    # Auth
    "python-jose[cryptography]==3.5.0",
    "bcrypt==5.0.0",
    "pyotp==2.10.0",
    "qrcode[pil]==8.2",
    "authlib==1.7.2",
    "python3-saml==1.16.0",

    # Cache & Queue
    "redis[hiredis]==6.4.0",
    "celery[redis]==5.6.3",
    "flower==2.1.0",

    # Storage
    "boto3==1.43.77",
    "python-magic==0.4.27",

    # Email
    "sendgrid==6.12.5",
    "jinja2==3.1.6",

    # Payments
    "stripe==15.5.1",

    # AI
    "anthropic==1.0.0",

    # Observability
    "structlog==26.1.0",
    "sentry-sdk[fastapi]==2.68.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
    "prometheus-fastapi-instrumentator==8.1.0",

    # Rate limiting
    "slowapi==0.1.10",

    # Utils
    "python-slugify==8.0.4",
    "pillow==12.3.0",
    "reportlab==5.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "factory-boy==3.3.3",
    "faker==40.36.0",
    "ruff==0.16.4",
    "mypy==1.15.0",
    "types-redis==4.6.0.20241004",
    "types-python-slugify==8.0.2.20240310",
    "pre-commit==4.6.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `param: X = Depends(...)` is the documented, idiomatic dependency-
# injection pattern -- B008 (no function calls in argument defaults) is a
# generic bugbear rule that predates FastAPI and doesn't know about it.
"app/routers/**/*.py" = ["B008"]
"app/routers/ws/**/*.py" = ["B008"]
# Mock/patch class aliases are conventionally CapWords (MockRepo, MockClient)
# by unittest.mock convention; N806 doesn't special-case test doubles.
"app/tests/**/*.py" = ["N806"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
addopts = "-v --tb=short"
markers = ["integration: exercises the full HTTP stack against a real test database"]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "app/db/seed.py"]
