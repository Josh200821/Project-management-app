[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saas-platform-api"
version = "1.0.0"
description = "SaaS Project Management Platform API"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.0",
    "python-multipart==0.0.9",
    "httpx==0.27.0",

    # Database
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.1",

    # Validation
    "pydantic==2.7.1",
    "pydantic-settings==2.3.0",
    "email-validator==2.1.1",

    # Auth
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "pyotp==2.9.0",
    "qrcode[pil]==7.4.2",
    "authlib==1.3.0",
    "python3-saml==1.16.0",

    # Cache & Queue
    "redis[hiredis]==5.0.4",
    "celery[redis]==5.3.6",
    "flower==2.0.1",

    # Storage
    "boto3==1.34.101",
    "python-magic==0.4.27",

    # Email
    "sendgrid==6.11.0",
    "jinja2==3.1.4",

    # Payments
    "stripe==9.9.0",

    # AI
    "anthropic==0.26.0",

    # Observability
    "structlog==24.2.0",
    "sentry-sdk[fastapi]==2.3.1",
    "opentelemetry-sdk==1.24.0",
    "opentelemetry-instrumentation-fastapi==0.45b0",
    "opentelemetry-instrumentation-sqlalchemy==0.45b0",
    "prometheus-fastapi-instrumentator==7.0.0",

    # Rate limiting
    "slowapi==0.1.9",

    # Utils
    "python-slugify==8.0.4",
    "pillow==10.3.0",
    "reportlab==4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "factory-boy==3.3.0",
    "faker==25.2.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "app/db/seed.py"]
