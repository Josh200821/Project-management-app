apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: saas-platform
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      component: worker
  template:
    metadata:
      labels:
        app: saas-platform
        component: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/your-org/saas-platform/api:latest
          command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
          envFrom:
            - secretRef:
                name: saas-platform-secrets
            - configMapRef:
                name: saas-platform-config
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
