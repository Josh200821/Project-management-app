apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: saas-platform
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      component: web
  template:
    metadata:
      labels:
        app: saas-platform
        component: web
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/saas-platform/web:latest
          ports:
            - containerPort: 3000
          env:
            - name: VITE_API_URL
              valueFrom:
                configMapKeyRef:
                  name: saas-platform-config
                  key: API_URL
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    component: web
  ports:
    - port: 3000
      targetPort: 3000
