version: "3.9"

services:
  api:
    build:
      context: ./apps/api
      target: development
    command: pytest
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db-test:5432/saas_test
      - DATABASE_URL_SYNC=postgresql://postgres:postgres@db-test:5432/saas_test
      - REDIS_URL=redis://redis-test:6379/0
      - CELERY_BROKER_URL=redis://redis-test:6379/1
      - ENVIRONMENT=test
      - JWT_SECRET=test-secret-key-not-for-production
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - test-net

  db-test:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=saas_test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - test-net

  redis-test:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - test-net

networks:
  test-net:
    driver: bridge
